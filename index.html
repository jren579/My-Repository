<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0b6e69">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Training Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a bedside observation chart. Ruled paper, condensed numerals, yellow and red flag zones for anything out of range. */
:root{
  --paper:#eef2f0; --card:#ffffff; --ink:#13201e; --muted:#5a6966; --line:#d3dbd8;
  --accent:#0b6e69; --accent-ink:#ffffff; --tint:#dff0ee;
  --flag-y:#f3c63a; --flag-r:#d8452f; --good:#2c8a57; --zone-y:#fbefc4; --zone-r:#f8d6cf;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1514; --card:#172120; --ink:#e4edeb; --muted:#93a4a0; --line:#2b3835;
    --accent:#54c7be; --accent-ink:#052220; --tint:#17302e;
    --flag-y:#e0b63a; --flag-r:#e2604c; --good:#55b982; --zone-y:#3a3317; --zone-r:#3f201b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1514; --card:#172120; --ink:#e4edeb; --muted:#93a4a0; --line:#2b3835;
  --accent:#54c7be; --accent-ink:#052220; --tint:#17302e;
  --flag-y:#e0b63a; --flag-r:#e2604c; --good:#55b982; --zone-y:#3a3317; --zone-r:#3f201b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink)}
header h1{font:800 26px/1 var(--display);font-stretch:70%;text-transform:uppercase;letter-spacing:.01em;margin:0}
header .sub{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.pill{font:600 11px var(--mono);padding:4px 8px;border-radius:3px;border:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.pill.g{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.pill.y{background:var(--zone-y);border-color:var(--flag-y)}
.pill.r{background:var(--zone-r);border-color:var(--flag-r)}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
nav{padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--ink);background:var(--card)}
nav a{padding:11px 2px 12px;text-align:center;text-decoration:none;color:var(--muted);font:700 12px var(--display);font-stretch:80%;text-transform:uppercase;letter-spacing:.05em;border-right:1px solid var(--line)}
nav a:last-child{border-right:0}
nav a.on{color:var(--accent-ink);background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.rule{border-left:4px solid var(--accent)}
h2{font:800 15px/1.1 var(--display);font-stretch:80%;text-transform:uppercase;letter-spacing:.05em;margin:0;text-wrap:balance}
h3{font:600 13px var(--body);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font:800 44px/0.9 var(--display);font-stretch:66%;font-variant-numeric:tabular-nums}
.big small{font:500 12px var(--mono);color:var(--muted);margin-left:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label{display:flex;flex-direction:column;gap:3px;font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:0}
input,select,textarea{font:500 16px var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:8px;width:100%;min-width:0}
textarea{font-family:var(--body);resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:700 13px var(--display);font-stretch:85%;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-radius:3px;border:1px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:var(--line);color:var(--muted)}
button.sm{padding:6px 9px;font-size:11px}
button:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:var(--paper);font:500 13px var(--mono);color:var(--ink);text-transform:none;letter-spacing:0}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar{height:10px;background:var(--paper);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--flag-r)}
.macro{display:flex;flex-direction:column;gap:4px}
.macro .top{display:flex;justify-content:space-between;font:500 12px var(--mono)}
.strip{position:relative;height:26px;border:1px solid var(--line);border-radius:2px;background:linear-gradient(90deg,var(--zone-r) 0 45%,var(--zone-y) 45% 70%,var(--card) 70% 100%)}
.strip b{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.strip span{position:absolute;bottom:2px;font:500 9px var(--mono);color:var(--muted);text-transform:uppercase}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .n{min-width:0;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);padding:4px 8px;font:500 16px var(--mono)}
.sets{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:6px;align-items:center}
.sets .h{font:500 10px var(--mono);color:var(--muted);text-transform:uppercase}
.tick{padding:8px 0;border-color:var(--line);color:var(--muted)}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.note{background:var(--tint);border-left:3px solid var(--accent);padding:8px 10px;font-size:13px;border-radius:2px}
.warn{background:var(--zone-y);border-left:3px solid var(--flag-y);padding:8px 10px;font-size:13px;border-radius:2px}
svg{display:block;width:100%;height:auto}
.chart text{font:500 9px var(--mono);fill:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--line);border-radius:3px;padding:6px 2px;text-align:center;font:500 10px var(--mono);background:var(--paper);min-height:54px;display:flex;flex-direction:column;gap:3px;align-items:center}
.day.now{border-color:var(--ink);border-width:2px}
.day b{font:800 12px var(--display);font-stretch:80%;text-transform:uppercase}
.tag{font:600 9px var(--mono);padding:1px 4px;border-radius:2px;background:var(--tint);color:var(--accent)}
.tag.h{background:var(--zone-y);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:3px;font:500 13px var(--body);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
details summary{cursor:pointer;font-weight:600}
ol,ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1 id="title">Training Chart</h1><div class="sub" id="sub"></div></div>
    <div class="pill" id="hpill">Loading</div>
  </header>
  <main id="main"><div class="card"><p class="muted">Loading your chart…</p></div></main>
  <nav id="nav">
    <a href="#today" data-t="today">Today</a><a href="#food" data-t="food">Food</a><a href="#train" data-t="train">Train</a><a href="#progress" data-t="progress">Trends</a><a href="#setup" data-t="setup">Setup</a>
  </nav>
</div>
<div id="toast" role="status"></div>
<script src="fflate.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)};
const today=()=>dstr(new Date());
const DOW=['sun','mon','tue','wed','thu','fri','sat'];
const dow=s=>DOW[parseD(s).getDay()];
const weekStart=s=>addD(s,-((parseD(s).getDay()+6)%7));
const nice=s=>parseD(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
const hm=s=>{const a=String(s||'0:0').split(':').map(Number);return a[0]*60+(a[1]||0)};
const toHM=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(Math.round(m%60))};

/* ---------- storage ---------- */
const CORE0={profile:{sex:'',age:'',h:'',w:'',rate:0.5,act:1.55,maxHr:'',mins:45,start:'06:30',finish:'16:30',wake:'',commute:28,inc:2.5,kadj:0},
  plan:{mon:{ride:1},tue:{ride:1,gym:1},wed:{ride:1,hard:1},thu:{ride:1,gym:1},fri:{ride:1},sat:{gym:1},sun:{}},
  favs:[],rot:0,active:null};
let docs={core:clone(CORE0)};
const Store={mode:'loading',col:null,timers:{},chain:{},
  async init(){
    this.mode='local';
    try{const raw=localStorage.getItem('tc-docs');if(raw)docs=JSON.parse(raw)}catch(e){}
    docs.core=Object.assign(clone(CORE0),docs.core||{});
    docs.core.profile=Object.assign(clone(CORE0.profile),docs.core.profile||{});
  },
  save(id){
    if(this.mode==='local'){try{localStorage.setItem('tc-docs',JSON.stringify(docs))}catch(e){toast('Phone storage is full. Download a backup from Setup.')}return}
    clearTimeout(this.timers[id]);
    this.timers[id]=setTimeout(()=>{
      const body=clone(docs[id]);
      this.chain[id]=(this.chain[id]||Promise.resolve()).then(()=>this.col.doc(id).set(body)).catch(e=>{
        toast(e&&e.code==='quota_exceeded'?'Storage is full. Copy your data from Setup.':'Could not save just now. Your next change will retry.');
      });
    },700);
  }
};
const core=()=>docs.core, P=()=>docs.core.profile;
const saveCore=()=>Store.save('core');
function dayDoc(date,make){const id='days-'+date.slice(0,7);if(!docs[id]){if(!make)return null;docs[id]={d:{}}}return docs[id]}
function day(date,make){const dd=dayDoc(date,make);if(!dd)return null;if(!dd.d[date]){if(!make)return null;dd.d[date]={}}return dd.d[date]}
const saveDay=date=>Store.save('days-'+date.slice(0,7));
function health(date){const h=docs['health-'+date.slice(0,4)];return h&&h.d?h.d[date]||null:null}
function sessions(){let out=[];Object.keys(docs).filter(k=>k.startsWith('sessions-')).sort().forEach(k=>{out=out.concat(docs[k].list||[])});return out}

/* ---------- physiology ---------- */
function metric(date,key){const d=day(date);const v=d&&d.check?num(d.check[key]):null;if(v!=null)return v;const h=health(date);return h&&h[key]!=null?h[key]:null}
function baseline(date,key){const v=[];for(let i=1;i<=28;i++){const m=metric(addD(date,-i),key);if(m!=null)v.push(m)}return v.length>=5?v.reduce((a,b)=>a+b,0)/v.length:null}
function readiness(date){
  const parts=[];const add=(w,s)=>parts.push([w,clamp(s,0,1)]);
  const sl=metric(date,'sleep');if(sl!=null)add(.3,(sl-4.5)/3);
  const hv=metric(date,'hrv'),hb=baseline(date,'hrv');if(hv!=null&&hb)add(.2,(hv/hb-.8)/.2);
  const rh=metric(date,'rhr'),rb=baseline(date,'rhr');if(rh!=null&&rb)add(.15,1-(rh-rb)/7);
  const d=day(date),c=d&&d.check||{};
  if(c.energy)add(.2,(c.energy-1)/4);
  if(c.sore)add(.15,(5-c.sore)/4);
  if(!parts.length)return null;
  const tw=parts.reduce((a,p)=>a+p[0],0);
  return Math.round(100*parts.reduce((a,p)=>a+p[0]*p[1],0)/tw);
}
function isLate(c){c=c||{};if(c.late)return true;if(!c.wf)return false;let f=hm(c.wf);const s0=hm(c.ws||P().start);if(f<s0)f+=1440;return f>=hm(P().finish)+60}
function workHours(date){const d=day(date),c=d&&d.check;if(!c||!c.wf)return 0;let f=hm(c.wf);const s0=hm(c.ws||P().start);if(f<s0)f+=1440;return Math.max(0,(f-s0)/60)}
const band=r=>r==null?'':r>=70?'g':r>=45?'y':'r';
function weights(){const m={};Object.keys(docs).forEach(k=>{if(k.startsWith('health-')){const d=docs[k].d||{};for(const x in d)if(d[x].weight)m[x]=d[x].weight}});
  Object.keys(docs).forEach(k=>{if(k.startsWith('days-')){const d=docs[k].d||{};for(const x in d){const w=num(d[x].weight);if(w)m[x]=w}}});
  return Object.keys(m).sort().map(k=>({d:k,w:m[k]}))}
function currentWeight(){const w=weights();return w.length?w[w.length-1].w:num(P().w)}
function targets(){
  const p=P(),w=currentWeight(),h=num(p.h),a=num(p.age);
  if(!(w&&h&&a&&p.sex))return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==='m'?5:-161);
  const tdee=bmr*(num(p.act)||1.55);
  const def=Math.min(w*(num(p.rate)||0)/100*7700/7,.25*tdee);
  const kcal=Math.round((tdee-def+(num(p.kadj)||0))/10)*10;
  const pro=Math.round(2*w),fat=Math.round(.8*w);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),def:Math.round(def),kcal,pro,fat,carb:Math.max(0,Math.round((kcal-pro*4-fat*9)/4))};
}
function weightTrend(){
  const end=today(),pts=weights().filter(x=>x.d>=addD(end,-21));
  if(pts.length<6)return null;
  const xs=pts.map(p=>(parseD(p.d)-parseD(pts[0].d))/864e5),ys=pts.map(p=>p.w);
  if(xs[xs.length-1]<10)return null;
  const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let sxy=0,sxx=0;for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2}
  const slope=sxy/sxx;return {kgWk:slope*7,pctWk:slope*7/my*100};
}
function maxHr(){const p=P();return num(p.maxHr)||(num(p.age)?Math.round(208-.7*num(p.age)):null)}
function foodTotals(date){const d=day(date);const t={kcal:0,p:0,c:0,f:0};(d&&d.food||[]).forEach(x=>{t.kcal+=+x.kcal||0;t.p+=+x.p||0;t.c+=+x.c||0;t.f+=+x.f||0});return t}
const NOT_CARDIO=/Strength|Yoga|Pilates|Flexibility|Cooldown|MindAndBody|Core/;
function cardioMin(date){const d=day(date);const man=(d&&d.cardio||[]).reduce((a,c)=>a+(+c.min||0),0);
  const h=health(date);const imp=(h&&h.wo||[]).filter(w=>!NOT_CARDIO.test(w.t)).reduce((a,w)=>a+w.m,0);return Math.max(man,imp)}
function weekCardio(ws){let t=0;for(let i=0;i<7;i++)t+=cardioMin(addD(ws,i));return Math.round(t)}

/* ---------- training library ---------- */
const X=(tag,m,alts,lo,hi,rest,w0,w1,note)=>({tag,m,alts,sets:3,lo,hi,rest,w0,w1,note,c:/1$/.test(tag)});
const T={
 A:{name:'Session A',focus:'Back and shoulders',ex:[
  X('A1','back',['Weighted pull-up','Weighted chin-up','Lat pulldown'],5,8,'2–2.5 min',10,'10 kg added, 8/6/5','Weight is the load added to body weight.'),
  X('A2a','delts',['Seated DB shoulder press','Machine shoulder press','Overhead press'],8,10,'none',22.9,'22.9'),
  X('A2b','back',['Barbell row','Chest-supported row','Seated cable row'],8,10,'90 s',70,'60/70/70'),
  X('A3a','delts',['Cable lateral raise','Dumbbell lateral raise','Machine lateral raise'],12,20,'none',7.5,'7.5 kg'),
  X('A3b','core',['Hanging leg raise','Hanging knee raise','Ab wheel'],10,15,'60 s','','3 × 10')]},
 B:{name:'Session B',focus:'Legs, traps and arms',ex:[
  X('B1','hams',['Trap-bar deadlift','Romanian deadlift','Hip thrust'],5,8,'2.5 min',140,'120/140/140','Easing back in: build the load over your first 2 to 3 weeks.'),
  X('B2a','quads',['Hack squat','Leg press','Bulgarian split squat'],8,10,'none',100,'80/100/100'),
  X('B2b','traps',['Dumbbell incline shrug','Barbell shrug','Cable shrug'],8,12,'90 s',30,'30'),
  X('B3a','arms',['EZ-bar curl','Incline dumbbell curl','Cable curl'],8,12,'none',25,'25'),
  X('B3b','arms',['Rope pushdown','Overhead cable extension','Dips'],12,15,'60 s','','')]},
 C:{name:'Session C',focus:'Chest, lats and abs',ex:[
  X('C1','chest',['Bench press','Dumbbell bench press','Incline bench press'],5,8,'2–2.5 min','',''),
  X('C2a','hams',['Romanian deadlift','45° back extension','Seated leg curl'],8,10,'none','',''),
  X('C2b','back',['Lat pulldown','Neutral-grip pulldown','Pull-up'],10,12,'90 s','',''),
  X('C3a','delts',['Lean-away lateral raise','Cable lateral raise','Reverse pec deck'],15,20,'none','',''),
  X('C3b','core',['Weighted cable crunch','Hanging leg raise','Pallof press'],12,15,'60 s','','')]}
};
const ORDER=['A','B','C'];
const MUSCLE={back:'Back',delts:'Shoulders',chest:'Chest',hams:'Hams and glutes',quads:'Quads',traps:'Traps',arms:'Arms',core:'Abs'};
function lastPerf(name){const s=sessions();for(let i=s.length-1;i>=0;i--){const e=(s[i].ex||[]).find(x=>x.name===name);if(e&&e.sets.length)return e}return null}
function genSession(key,mins,r,late){
  const mode=(late||mins<=30||(r!=null&&r<45))?'min':(r!=null&&r<70)?'trim':'full';
  const easy=mode!=='full';
  let ex=T[key].ex.map((e,i)=>({key,slot:i,tag:e.tag,rest:e.rest,note:e.note||'',m:e.m,alt:0,name:e.alts[0],lo:e.lo,hi:e.hi,c:!!e.c,n:e.sets,rir:e.c?(easy?3:2):(easy?2:1)}));
  if(mode==='min')ex=ex.slice(0,3);
  if(mode==='trim')ex.forEach(e=>{if(!e.c)e.n=2});
  if(mode==='full'&&mins>=55)ex.forEach(e=>{if(e.c)e.n+=1});
  ex.forEach(e=>fillSets(e));
    return {key,mode,date:today(),est:Math.round(5+ex.reduce((a,e)=>a+e.n*(e.c?3.2:2),0)),ex};
}
function fillSets(e){
  const last=lastPerf(e.name),inc=num(P().inc)||2.5;const src=T[e.key].ex[e.slot]||{};let w=e.alt===0&&src.w0!==''&&src.w0!=null?src.w0:'';e.tip=(e.alt===0&&src.w1)?'Week 1 in your sheet: '+src.w1+'.':'First time: choose a load you could lift about '+(e.hi+2)+' times.';
  if(last){const top=Math.max.apply(null,last.sets.map(s=>s.w||0));const ts=last.sets.filter(s=>(s.w||0)===top);
    const txt=last.sets.map(s=>(s.w||0)+'×'+s.r).join(', ');

function lineChart(pts,o){
  o=o||{};if(pts.length<2)return '<p class="muted small">'+esc(o.empty||'Not enough data yet.')+'</p>';
  const W=320,H=o.h||120,L=30,R=34,Tp=8,B=16;
  let ys=pts.map(p=>p.y),lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  if(o.zones)o.zones.forEach(z=>{if(z.show){lo=Math.min(lo,z.at);hi=Math.max(hi,z.at)}});
  const padY=(hi-lo)*.15||1;lo-=padY;hi+=padY;
  const X=i=>L+(W-L-R)*i/(pts.length-1),Y=v=>Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'chart')+'">';
  (o.zones||[]).forEach(z=>{const y=clamp(Y(z.at),Tp,H-B);const top=z.below?y:Tp,ht=z.below?H-B-y:y-Tp;if(ht>0)s+='<rect x="'+L+'" y="'+top+'" width="'+(W-L-R)+'" height="'+ht+'" fill="var(--zone-'+z.c+')"/>'});
  for(let g=0;g<3;g++){const v=lo+(hi-lo)*(g+.5)/3,y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+(o.dp?v.toFixed(o.dp):Math.round(v))+'</text>'}
  s+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="'+pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ')+'"/>';
  if(pts.length<=30)pts.forEach((p,i)=>{s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2" fill="var(--card)" stroke="var(--accent)" stroke-width="1.5"/>'});
  const lp=pts[pts.length-1];
  s+='<circle cx="'+X(pts.length-1)+'" cy="'+Y(lp.y)+'" r="4" fill="var(--accent)"/><text x="'+(W-R+7)+'" y="'+(Y(lp.y)+3)+'" style="font-weight:600;fill:var(--ink)">'+(o.dp?lp.y.toFixed(o.dp):Math.round(lp.y))+'</text>';
  s+='<text x="'+L+'" y="'+(H-3)+'">'+esc(pts[0].x)+'</text><text x="'+(W-R)+'" y="'+(H-3)+'" text-anchor="end">'+esc(lp.x)+'</text></svg>';
  return s;
}
function barChart(vals,labels,target,unit,aria){unit=unit||'min';
  const W=320,H=110,L=30,B=16,Tp=8;const mx=Math.max(target||0,Math.max.apply(null,vals),1)*1.1;
  const bw=(W-L-6)/vals.length;let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria||'Weekly cardio minutes')+'">';
  [0,.5,1].forEach(f=>{const v=mx*f,y=Tp+(H-Tp-B)*(1-f);s+='<line x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(v)+'</text>'});
  vals.forEach((v,i)=>{const h=(H-Tp-B)*v/mx;s+='<rect x="'+(L+i*bw+3)+'" y="'+(H-B-h)+'" width="'+(bw-6)+'" height="'+h+'" fill="var(--accent)" opacity="'+(i===vals.length-1?1:.55)+'"/><text x="'+(L+i*bw+bw/2)+'" y="'+(H-3)+'" text-anchor="middle">'+esc(labels[i])+'</text>'});
  if(target){const y=Tp+(H-Tp-B)*(1-target/mx);s+='<line x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--ink)" stroke-dasharray="4 3"/><text x="'+(W-2)+'" y="'+(y-3)+'" text-anchor="end" style="fill:var(--ink)">'+target+' '+unit+'</text>'}
  return s+'</svg>';
}

function HealthParser(cutoff){
  const A=n=>new RegExp('(?:^|\\s)'+n+'="([^"]*)"');
  const rType=A('type'),rVal=A('value'),rStart=A('startDate'),rEnd=A('endDate'),rSrc=A('sourceName'),rAct=A('workoutActivityType'),rDur=A('duration'),rUnit=A('durationUnit'),rAvg=A('average');
  const g=(s,r)=>{const m=r.exec(s);return m?m[1]:null};
  const ms=s=>Date.parse(s.slice(0,10)+'T'+s.slice(11,19)+s.slice(20,23)+':'+s.slice(23,25));
  const TYPES={HKQuantityTypeIdentifierRestingHeartRate:'rhr',HKQuantityTypeIdentifierHeartRateVariabilitySDNN:'hrv',HKQuantityTypeIdentifierStepCount:'steps',HKQuantityTypeIdentifierActiveEnergyBurned:'active',HKQuantityTypeIdentifierBodyMass:'weight',HKQuantityTypeIdentifierVO2Max:'vo2',HKCategoryTypeIdentifierSleepAnalysis:'sleep'};
  const acc={};let buf='',curWo=null,count=0;
  const D=d=>acc[d]||(acc[d]={avg:{},sum:{},last:{},wo:[]});
  const re=/<(Record|Workout|WorkoutStatistics)\s([^>]*)>|<\/Workout>/g;
  function tag(name,a){
    if(name==='Record'){
      const ty=g(a,rType),k=TYPES[ty];if(!k)return;
      const end=g(a,rEnd)||g(a,rStart);if(!end)return;const d=end.slice(0,10);if(d<cutoff)return;
      const val=g(a,rVal);count++;
      if(k==='sleep'){if(!/Asleep/.test(val||''))return;const h=(ms(end)-ms(g(a,rStart)))/36e5;if(!(h>0&&h<24))return;const src=g(a,rSrc)||'?';const o=D(d).sum;(o.sleep=o.sleep||{})[src]=(o.sleep[src]||0)+h;return}
      const v=parseFloat(val);if(!isFinite(v))return;
      if(k==='rhr'||k==='hrv'){const o=D(d).avg;(o[k]=o[k]||[0,0])[0]+=v;o[k][1]++}
      else if(k==='steps'||k==='active'){const src=g(a,rSrc)||'?';const o=D(d).sum;(o[k]=o[k]||{})[src]=(o[k][src]||0)+v}
      else D(d).last[k]=v;
    }else if(name==='Workout'){
      const st=g(a,rStart);if(!st)return;const d=st.slice(0,10);let m=parseFloat(g(a,rDur));const u=g(a,rUnit);if(u==='s')m/=60;if(u==='hr')m*=60;
      curWo={t:(g(a,rAct)||'Other').replace('HKWorkoutActivityType',''),m:Math.round(m)};
      if(d>=cutoff&&isFinite(m)){D(d).wo.push(curWo);count++}
      if(/\/\s*$/.test(a))curWo=null;
    }else if(name==='WorkoutStatistics'&&curWo){
      if(g(a,rType)==='HKQuantityTypeIdentifierHeartRate'){const av=parseFloat(g(a,rAvg));if(isFinite(av))curWo.hr=Math.round(av)}
    }
  }
  this.feed=function(text){
    buf+=text;const cut=buf.lastIndexOf('>');if(cut<0)return;
    const chunk=buf.slice(0,cut+1);buf=buf.slice(cut+1);let m;re.lastIndex=0;
    while((m=re.exec(chunk))){if(m[1])tag(m[1],m[2]);else curWo=null}
  };
  this.result=function(){
    const out={};const pick=o=>{let best=0,w=0;for(const s in o){if(/watch/i.test(s))w=Math.max(w,o[s]);best=Math.max(best,o[s])}return w||best};
    for(const d in acc){const a=acc[d],r={};
      if(a.avg.rhr)r.rhr=Math.round(a.avg.rhr[0]/a.avg.rhr[1]);
      if(a.avg.hrv)r.hrv=Math.round(a.avg.hrv[0]/a.avg.hrv[1]);
      if(a.sum.sleep)r.sleep=Math.round(pick(a.sum.sleep)*10)/10;
      if(a.sum.steps)r.steps=Math.round(pick(a.sum.steps));
      if(a.sum.active)r.active=Math.round(pick(a.sum.active));
      if(a.last.weight)r.weight=Math.round(a.last.weight*10)/10;
      if(a.last.vo2)r.vo2=Math.round(a.last.vo2*10)/10;
      if(a.wo.length)r.wo=a.wo.slice(0,8);
      if(Object.keys(r).length)out[d]=r}
    return {days:out,count};
  };
}
function mergeHealth(days){const touched={};Object.keys(days).forEach(d=>{const id='health-'+d.slice(0,4);const st=(docs[id]=docs[id]||{d:{}});st.d[d]=Object.assign({},st.d[d]||{},days[d]);touched[id]=1});Object.keys(touched).forEach(id=>Store.save(id))}
function summaryKey(name){const n=String(name).replace(/\s*\((sum|average|avg|most recent|mostRecent|min|max|minimum|maximum|total)\)\s*$/i,'').trim();
  if(/resting/i.test(n))return 'rhr';if(/variab|hrv/i.test(n))return 'hrv';if(/^sleep$/i.test(n)||/^sleep (duration|total)$/i.test(n))return 'sleep';if(/weight|body.?mass/i.test(n))return 'weight';if(/^steps?( count)?$/i.test(n)||/^step.?count$/i.test(n))return 'steps';return null}
function summaryVal(k,v){v=parseFloat(v);if(!isFinite(v))return null;
  if(k==='sleep'){const h=v>1000?v/3600:v>24?v/60:v;return h>=3&&h<=16?Math.round(h*10)/10:null}
  if(k==='weight')return v>20&&v<250?Math.round(v*10)/10:null;
  if(k==='rhr')return v>25&&v<130?Math.round(v):null;
  if(k==='hrv')return v>3&&v<300?Math.round(v):null;
  return Math.round(v)}
function parseSummary(text,isJson){const out={},put=(d,k,v)=>{if(!/^\d{4}-\d{2}-\d{2}/.test(d||''))return;const val=summaryVal(k,v);if(val==null)return;(out[d.slice(0,10)]=out[d.slice(0,10)]||{})[k]=val};
  if(isJson){let j=JSON.parse(text);if(!Array.isArray(j))j=j.data||j.days||j.rows||[];j.forEach(r=>{const vals=r.values||r,meta=r.metadata||{};for(const id in vals){if(id==='date'||id==='metadata'||id==='values')continue;const k=summaryKey(meta[id]&&meta[id].displayName||id.replace(/_/g,' '));if(k)put(r.date||r.Date,k,vals[id])}})}
  else{const lines=text.split(/\r?\n/).filter(l=>l.trim());const split=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o};
    const head=split(lines[0]).map(h=>h.trim()),di=head.findIndex(h=>/^date$/i.test(h));if(di<0)throw new Error('No Date column found.');const keys=head.map(summaryKey);
    lines.slice(1).forEach(l=>{const c=split(l);keys.forEach((k,i)=>{if(k&&c[i]!==undefined&&c[i]!=='')put(c[di],k,c[i])})})}
  return out}
async function importSummary(file){const say=m=>{importMsg=m;const el=$('#hk-msg');if(el)el.textContent=m};
  try{const days=parseSummary(await file.text(),/\.json$/i.test(file.name)),dates=Object.keys(days).sort();
    if(!dates.length)throw new Error('No usable days found. The file needs a date and at least one of sleep, resting heart rate, HRV, weight or steps.');
    mergeHealth(days);const has=k=>dates.filter(d=>days[d][k]!=null).length;
    say('Imported '+dates.length+' days through '+nice(dates[dates.length-1])+': sleep '+has('sleep')+', resting HR '+has('rhr')+', HRV '+has('hrv')+', weight '+has('weight')+', steps '+has('steps')+'.');toast('Summary imported');if(tab==='today')rr();else soft();
  }catch(e){say('Import failed: '+(e&&e.message||'could not read that file'))}}
async function importHealth(file){
  const say=m=>{importMsg=m;const el=$('#hk-msg');if(el)el.textContent=m};
  const parser=new HealthParser(addD(today(),-400)),dec=new TextDecoder();let read=0,found=false,err=null;
  say('Reading…');
  try{
    const reader=file.stream().getReader();
    const isZip=/\.zip$/i.test(file.name)||/zip/.test(file.type);
    let unz=null;
    if(isZip){
      if(!window.fflate)throw new Error('The unzip library did not load. Unzip the export and choose export.xml instead.');
      unz=new fflate.Unzip();unz.register(fflate.UnzipInflate);
      unz.onfile=f=>{if(!found&&/\.xml$/i.test(f.name)&&!/cda/i.test(f.name)){found=true;f.ondata=(e,chunk)=>{if(e){err=e;return}parser.feed(dec.decode(chunk,{stream:true}))};f.start()}};
    }
    for(;;){const {value,done}=await reader.read();if(done){if(unz)unz.push(new Uint8Array(0),true);break}
      read+=value.length;if(unz)unz.push(value,false);else{found=true;parser.feed(dec.decode(value,{stream:true}))}
      if(err)throw err;say('Reading… '+Math.round(read/file.size*100)+'%');await new Promise(r=>setTimeout(r,0))}
    const res=parser.result(),dates=Object.keys(res.days).sort();
    if(!found||!dates.length)throw new Error('No health records found. Choose the export.zip from the Health app, or the export.xml inside it.');
    mergeHealth(res.days);
    say('Imported '+dates.length+' days through '+nice(dates[dates.length-1])+'.');toast('Apple Health data imported');soft();
  }catch(e){say('Import failed: '+(e&&e.message||'could not read that file')+'')}
}
